@startuml
object pepe {
  categoria
  cantFaltas
  bonoPresentismo
  bonoResultado
  sueldo()
  }


object bonoDependeDeFaltas{
  
  monto(faltas)
 }

object bonoPorcentaje {
  monto(neto)
  }

object bonoFijo {
  monto(neto)
  }

object bonoNulo{
  monto(valor)
  }

Interface Bono {
  
  monto(valor)
  }

object gerente {
  neto
  neto()
  }

object cadete {
  neto 
  neto()
  }

Interface Categoria {
  neto()
  }
  
  
bonoDependeDeFaltas ..|> Bono
bonoPorcentaje ..|> Bono
bonoFijo ..|> Bono
bonoNulo ..|> Bono
pepe - -> Bono
pepe - -> Categoria
gerente ..|> Categoria
cadete ..|> Categoria
@enduml

